# Parchment release: pushing a tag like v0.2.0 builds and publishes a GitHub
# release with an AddOns-ready zip. The zip contains a top-level Parchment/
# folder holding ONLY what the game loads (.toc, .lua, Libs/, embeds.xml) plus
# LICENSE - no Tests/, docs, or CI config. Tools/ (the converter scripts) are
# deliberately not shipped: they are opt-in, downloadable from the repo.
#
# The release is gated: the test suite must pass, and the tag must match the
# .toc's "## Version:" line, so a stale version string can never ship.
#
# The same zip is then uploaded to CurseForge (project 1637964), tagged with
# the game versions the .toc's "## Interface:" line declares and carrying the
# GitHub release notes as its changelog. Needs the CF_API_KEY repo secret (a
# CurseForge author API token); rotating the token means updating that secret.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # gh release create

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Syntax-check all Lua files (except vendored Libs)
        run: |
          find . -name '*.lua' -not -path './Libs/*' -print0 \
            | xargs -0 -n1 luac5.1 -p

      - name: Run tests
        run: lua5.1 Tests/run.lua

      - name: Verify the tag matches the .toc version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## Version: ${VERSION}$" Parchment.toc; then
            echo "Tag ${GITHUB_REF_NAME} does not match Parchment.toc:" >&2
            grep '^## Version:' Parchment.toc >&2
            exit 1
          fi

      - name: Package the addon zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Same exclude list as the local deploy (CLAUDE.md): ship only what
          # the game loads, plus LICENSE.
          mkdir -p dist/Parchment
          rsync -a \
            --exclude=.git --exclude=.github --exclude='*.md' \
            --exclude=Tests --exclude=Tools --exclude=.luacheckrc \
            --exclude=dist \
            ./ dist/Parchment/
          cd dist
          zip -r -X "Parchment-${VERSION}.zip" Parchment
          zipinfo -1 "Parchment-${VERSION}.zip"

      - name: Create the GitHub release (or attach to an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Creating a release in the GitHub UI also creates the tag, so this
          # workflow may fire when the release already exists. In that case
          # attach the zip to it (keeping its hand-written notes) instead of
          # failing on the name collision; --clobber makes re-runs idempotent.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "dist/Parchment-${VERSION}.zip" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "dist/Parchment-${VERSION}.zip" \
              --title "Parchment ${VERSION}" \
              --generate-notes
          fi

      - name: Upload to CurseForge
        env:
          GH_TOKEN: ${{ github.token }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: "1637964"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Every CurseForge call reports its HTTP status and (truncated)
          # response body on failure - a silent -f would leave nothing to
          # debug with, and the responses carry no secrets.
          cf() {  # cf <output-file> <curl args...>
            local out="$1"; shift
            local code
            code=$(curl -s -o "$out" -w "%{http_code}" "$@")
            if [ "$code" != "200" ]; then
              echo "CurseForge API returned HTTP $code:" >&2
              head -c 500 "$out" >&2; echo >&2
              return 1
            fi
          }
          # The toc's "## Interface:" list maps straight to CurseForge
          # game-version ids: the API's apiVersion field uses the same
          # numbers (120007 = 12.0.7), so a patch bump stays a toc edit.
          export WANTED=$(grep -m1 '^## Interface:' Parchment.toc | cut -d: -f2 | tr -d ' ')
          cf versions.json -H "X-Api-Token: ${CF_API_KEY}" \
            "https://wow.curseforge.com/api/game/versions"
          export GAME_VERSIONS=$(python3 -c 'import json,sys,os; want=set(os.environ["WANTED"].split(",")); ids=[v["id"] for v in json.load(sys.stdin) if v.get("apiVersion") in want]; assert ids, "no CurseForge game version matched "+str(want); print(json.dumps(ids))' < versions.json)
          echo "game versions ${WANTED} -> ${GAME_VERSIONS}"
          # The CurseForge changelog is the GitHub release body, so the two
          # channels always tell the same story.
          export CHANGELOG=$(gh release view "${GITHUB_REF_NAME}" --json body -q .body)
          export DISPLAY_NAME="Parchment ${VERSION}"
          python3 -c 'import json,os; print(json.dumps({"changelog": os.environ["CHANGELOG"], "changelogType": "markdown", "displayName": os.environ["DISPLAY_NAME"], "gameVersions": json.loads(os.environ["GAME_VERSIONS"]), "releaseType": "release"}))' > metadata.json
          cf upload-result.json -H "X-Api-Token: ${CF_API_KEY}" \
            -F "metadata=<metadata.json" \
            -F "file=@dist/Parchment-${VERSION}.zip" \
            "https://wow.curseforge.com/api/projects/${CF_PROJECT_ID}/upload-file"
          echo "uploaded file id: $(cat upload-result.json)"
