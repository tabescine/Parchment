<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#3d352c"/>
      <stop offset="70%" stop-color="#2b2620"/>
      <stop offset="100%" stop-color="#211d18"/>
    </radialGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9c9a3"/>
      <stop offset="12%" stop-color="#ecdfbf"/>
      <stop offset="50%" stop-color="#f2e7cb"/>
      <stop offset="88%" stop-color="#ecdfbf"/>
      <stop offset="100%" stop-color="#d9c9a3"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2e7cb"/>
      <stop offset="45%" stop-color="#e3d4ae"/>
      <stop offset="100%" stop-color="#c4b189"/>
    </linearGradient>
    <linearGradient id="rollB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f2e7cb"/>
      <stop offset="45%" stop-color="#e3d4ae"/>
      <stop offset="100%" stop-color="#c4b189"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="90" fill="none"
        stroke="#c8a868" stroke-opacity="0.5" stroke-width="4"/>

  <!-- scroll sheet -->
  <path d="M138 146 L374 146 L374 366 L138 366 Z" fill="url(#sheet)"/>
  <!-- shadow under the top roll / above the bottom roll -->
  <rect x="138" y="146" width="236" height="14" fill="#a8946c" opacity="0.45"/>
  <rect x="138" y="352" width="236" height="14" fill="#a8946c" opacity="0.35"/>

  <!-- top roll -->
  <rect x="112" y="112" width="288" height="46" rx="23" fill="url(#roll)"/>
  <rect x="112" y="112" width="288" height="46" rx="23" fill="none"
        stroke="#8a744f" stroke-width="3"/>
  <circle cx="135" cy="135" r="10" fill="#b39d72"/>
  <circle cx="377" cy="135" r="10" fill="#b39d72"/>

  <!-- bottom roll -->
  <rect x="112" y="354" width="288" height="46" rx="23" fill="url(#rollB)"/>
  <rect x="112" y="354" width="288" height="46" rx="23" fill="none"
        stroke="#8a744f" stroke-width="3"/>
  <circle cx="135" cy="377" r="10" fill="#b39d72"/>
  <circle cx="377" cy="377" r="10" fill="#b39d72"/>

  <!-- sheet edge -->
  <path d="M138 158 L138 354 M374 158 L374 354" stroke="#8a744f" stroke-width="3"/>

  <!-- inked d20 wireframe, centered on the sheet -->
  <g stroke="#5a4531" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"
     fill="none" transform="translate(256 256) scale(0.82)">
    <!-- outer hexagon, pointy top -->
    <path d="M0 -100 L86.6 -50 L86.6 50 L0 100 L-86.6 50 L-86.6 -50 Z"/>
    <!-- central face -->
    <path d="M-52 -30 L52 -30 L0 60 Z" fill="#e6d5ac" fill-opacity="0.55"/>
    <!-- wireframe edges -->
    <path d="M0 -100 L-52 -30 M0 -100 L52 -30"/>
    <path d="M-86.6 -50 L-52 -30 M86.6 -50 L52 -30"/>
    <path d="M-86.6 50 L-52 -30 M86.6 50 L52 -30"/>
    <path d="M-86.6 50 L0 60 M86.6 50 L0 60 M0 100 L0 60"/>
  </g>

  <!-- gold pips flanking the scroll -->
  <path d="M62 256 l12 -12 12 12 -12 12 Z" fill="#c8a868" opacity="0.85"/>
  <path d="M426 256 l12 -12 12 12 -12 12 Z" fill="#c8a868" opacity="0.85"/>
</svg>
