# Parchment Sample - neutral demo system (NOT a real ruleset; public domain).
# Demonstrates the TOML system format. Import with /pmt import or convert with
# parchment_converter.py. JSON (sample.system.json) is often easier for deeply
# nested systems; both import identically.

system_name = "Parchment Sample"
version = "1.0"
damage_types = ["slashing", "piercing", "blunt", "fire", "frost", "arcane"]

[modifier_table]
1 = -3
2 = -2
3 = -2
4 = -1
5 = -1
6 = 0
7 = 0
8 = 1
9 = 1
10 = 2
11 = 2
12 = 3

[point_buy]
total = 15
base = 1
min = 1
max = 8

# Suggested accomplished-proficiency counts; a target may scale by an attribute.
[accomplish_targets]
skills = { base = 3, attribute = "wits" }
weapons = { base = 5, attribute_max = ["might", "wits"] }
saves = { base = 2 }

# Which attributes drive the derived stats (all optional; unset = no coupling).
[derived_stats]
hit_die_attribute = "might"
hp_attribute = "might"
retroactive_hp = true            # changing Might re-grants HP for past levels (opt-in)
spell_attributes = ["spirit"]
mana_attribute = "spirit"
mana_multiplier = 2
movement_attribute = "wits"

[accomplishment_table]
1 = 1
2 = 1
3 = 2
4 = 2
5 = 3
6 = 3
7 = 4
8 = 4
9 = 5
10 = 5

[level_bonuses.5]
actions = 1

[[hit_dice_bands]]
max_mod = -1
die = "d6"

[[hit_dice_bands]]
max_mod = 1
die = "d8"

[[hit_dice_bands]]
max_mod = 3
die = "d10"

[[attributes]]
id = "might"
name = "Might"

[[attributes]]
id = "wits"
name = "Wits"

[[attributes]]
id = "spirit"
name = "Spirit"

[[skills]]
id = "athletics"
name = "Athletics"
attribute = "might"

[[skills]]
id = "endurance"
name = "Endurance"
attribute = "might"

[[skills]]
id = "lore"
name = "Lore"
attribute = "wits"

[[skills]]
id = "perception"
name = "Perception"
attribute = "wits"

[[skills]]
id = "persuasion"
name = "Persuasion"
attribute = "spirit"

[[skills]]
id = "resolve"
name = "Resolve"
attribute = "spirit"

[[weapons]]
id = "blade"
name = "Blade"
attribute = "might"

[[weapons]]
id = "bow"
name = "Bow"
attribute = "wits"

[[weapons]]
id = "staff"
name = "Staff"
attribute = "spirit"

# attribute may be a list: the best of the named modifiers governs the
# attack roll (finesse-style "use either" weapons).
[[weapons]]
id = "dirk"
name = "Dirk"
attribute = [ "might", "wits" ]

[[racial_traits]]
id = "human"
name = "Human"
description = "Versatile folk. +1 Wits."
[[racial_traits.effects]]
type = "attribute"
id = "wits"
value = 1

[[racial_traits]]
id = "orc"
name = "Orc"
description = "Hardy and strong. +1 Might."
[[racial_traits.effects]]
type = "attribute"
id = "might"
value = 1

[[origin_traits]]
id = "scholarly"
name = "Scholarly Upbringing"
description = "Two extra points to spend at creation."
[[origin_traits.effects]]
type = "attribute_points"
value = 2

[[origin_traits]]
id = "hardened"
name = "Hardened"
description = "A life of toil. +1 Endurance."
[[origin_traits.effects]]
type = "skill"
skill = "endurance"
value = 1

[[perk_trees]]
id = "wanderer"
name = "Path of the Wanderer"
governing_attribute = "wits"

[[perk_trees.layout.rows]]
perks = ["keen_eye", "scholar"]

[[perk_trees.layout.rows]]
perks = ["toughened"]

[[perk_trees.perks]]
id = "keen_eye"
name = "Keen Eye"
description = "Your senses sharpen. +1 to Perception."
[[perk_trees.perks.effects]]
type = "skill"
skill = "perception"
value = 1

[[perk_trees.perks]]
id = "scholar"
name = "Scholar"
description = "Choose a skill; it gains an extra accomplishment bonus."
[perk_trees.perks.choice]
kind = "skill"
count = 1
apply = "double_accomplishment"
prompt = "Choose a skill to master."

[[perk_trees.perks]]
id = "toughened"
name = "Toughened"
description = "Hard roads make hard travellers. +1 to Endurance."
prerequisites = ["keen_eye"]
[[perk_trees.perks.effects]]
type = "skill"
skill = "endurance"
value = 1
