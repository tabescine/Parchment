# =============================================================================
# Parchment Sample - annotated example item library (for sample.character.toml).
#
# The item library is GLOBAL: one library per install, shared by every
# character and independent of the loaded system. Characters do not copy items,
# they reference them (see the `inventory` block in sample.character.toml), so
# editing an item here updates every character carrying it.
#
# Import it with /pmt import (paste the whole file) - order does not matter,
# but system -> items -> character gives a demo where everything resolves at
# once. Importing MERGES by id: an item you already have under the same id is
# overwritten, everything else is left alone.
#
# Each item is a table under [items.<id>], and the id must appear BOTH as the
# table key and as the record's `id` field (inventories resolve by key, so the
# two disagreeing would silently point at a different item).
#
# Required fields: id, name, kind. `kind` is one of:
#   weapon    - equippable; `bonus` adds to the linked weapon's attack rolls
#   equipment - equippable; `ac_mod_cap` (optional) caps the wearer's AC
#               attribute modifier while worn (see itm_4)
#   gear      - not equippable; carries the per-character counter instead
# Weapon and equipment items may also carry `effects` (see itm_2 and itm_5):
# modifiers from the shared effect vocabulary - saving throws, skills,
# attributes, AC, initiative and more - that fold into the sheet only while
# the item is equipped. A piece of armor's +AC is simply an "ac" effect.
# Everything else is optional. (Old files with the retired `ac_bonus` field
# still import; the value is folded into an "ac" effect on the way in.)
# =============================================================================

# A weapon item. `weapon_id` links it to a weapon in the loaded system
# (sample.system.toml's "bow"); the link is soft - an item whose weapon_id
# names nothing in your system still shows, it just has no attack roll to
# boost. `bonus` is the magic +X on attack rolls only (damage is unchanged).
[items.itm_1]
id = "itm_1"
name = "Hunter's Bow"
kind = "weapon"
description = "A well-kept shortbow of ash and sinew. Its draw is quick and forgiving."
icon = "inv_weapon_bow_08"   # plain texture name (letters, digits, '_' and '-')
weapon_id = "bow"
bonus = 1
version = 1                  # bumped on every save; used by future item transfer

# An equipment item. Its +AC is an "ac" effect, applied for every equipped
# piece - they stack, so a second worn item adds its own bonus on top.
[items.itm_2]
id = "itm_2"
name = "Traveller's Leathers"
kind = "equipment"
description = "Scuffed riding leathers, oiled against the weather."
icon = "inv_chest_leather_09"
version = 1

[[items.itm_2.effects]]
type = "ac"
value = 1

# Heavier armor may also CAP the wearer's AC attribute modifier while worn
# (`ac_mod_cap`): the modifier counts as at most this value, so this plate
# protects a clumsy guard and a nimble duelist equally. 0 means no modifier at
# all (heavy armor), 2 or 3 is a typical medium-armor cap, and leaving the
# field out means the full modifier applies (light armor, plain clothing).
# When several worn pieces carry a cap the lowest wins; the cap never raises a
# modifier already below it, and an "ac" effect still stacks on top as usual.
[items.itm_4]
id = "itm_4"
name = "Guard's Plate"
kind = "equipment"
description = "Municipal-issue plate, sized for whoever stands the watch."
icon = "inv_chest_plate04"
ac_mod_cap = 0
version = 1

[[items.itm_4.effects]]
type = "ac"
value = 3

# An equipment item with `effects`: modifiers that apply only while the piece
# is equipped. Each effect names a `type` from the shared vocabulary (the same
# one traits and homebrew use): "save" (target attribute in `id`), "skill"
# (target in `skill`), "attribute" (target in `id`), plus target-free types
# like "ac", "initiative", "attack_rolls", "max_hp". `value` is the signed
# bonus (at most +/-99, up to 10 effects). Targets are ids from the loaded
# system; one the system does not define simply never lands.
[items.itm_5]
id = "itm_5"
name = "Ring of the Owl"
kind = "equipment"
description = "A worn silver band, cool against the skin. The owl sees what others miss."
icon = "inv_jewelry_ring_03"
version = 1

[[items.itm_5.effects]]
type = "skill"
skill = "perception"
value = 1

[[items.itm_5.effects]]
type = "save"
id = "spirit"
value = 1

# A gear item: no mechanics at all, just a name and the counter each character
# keeps. `default_count` seeds that counter when the item is added to someone
# (Wren already carries 12 of these, and her own count wins).
[items.itm_3]
id = "itm_3"
name = "Arrows"
kind = "gear"
description = "Goose-fletched, kept dry in a waxed quiver."
icon = "inv_misc_ammo_arrow_01"
default_count = 20
version = 1
