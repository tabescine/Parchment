# =============================================================================
# Parchment Sample - annotated example character (for sample.system.toml).
#
# Like the system file, this doubles as the reference for the character
# format: every field the addon reads appears here with a comment. Import it
# AFTER the system with /pmt import (paste the whole file), or convert it with
# parchment_converter.py. sample.character.json is the same character in JSON.
#
# Required fields: name, level, attributes - plus _key when importing a single
# character in-game (it becomes the character's slot in the roster; exports
# add it automatically). Everything else is optional.
#
# TOML note: keep these top-level keys ABOVE the first [section] header -
# anything below a header belongs to that section.
# =============================================================================

_key = "wren"        # roster slot for single-character import; never stored

name = "Wren Ashdown"
player = "example"   # the player behind the character (free-form)
race = "human"       # free-form display string; the editor offers the system's
                     # `races` list (or the races its racial traits name)
level = 5
quote = "The map is never the territory, but it keeps you from walking off a cliff."
notes = "A demo character for the Parchment Sample system. Not part of any real ruleset."

# Which attribute fills each configurable role on the sheet:
#   primary_attribute - drives the save DC; spellcaster if it is one of the
#                       system's derived_stats.spell_attributes
#   ac_attribute      - its modifier is added to AC
#   init_attribute    - its modifier is the initiative base
#   cast_attribute    - the spellcasting attribute, from the active spell
#                       pack's cast_attributes; gates spell ranks
primary_attribute = "wits"
ac_attribute = "wits"
init_attribute = "wits"
cast_attribute = "spirit"

# Resources. max_hp is the rolled total the player tracks; trait/perk max_hp
# effects are added ON TOP for display (here: 26 + 2 Hardened + 4 Toughness
# = 32 shown). An explicit max_mana overrides the derived formula (which
# would give 2 x Spirit modifier = 0 here). Wren casts via cast_attribute
# (Spirit), so the sheet shows a save DC and spell attack derived from it.
# temp_hp sits above current HP and is spent first.
max_hp = 26
current_hp = 24
temp_hp = 2
max_mana = 8
current_mana = 8
hit_dice = "5d6"     # informational; the editor keeps it current on level-up

# One racial trait (id from the system's racial_traits) and any number of
# origin traits. Their bonuses/penalties fold into the sheet automatically.
racial_trait = "human"
origin_traits = ["scholarly", "hardened"]

# Accomplished = proficient: these get the level-based accomplishment bonus.
# Skills/weapons reference system ids; saves use ATTRIBUTE ids.
accomplished_skills = ["lore", "perception", "persuasion"]
accomplished_weapons = ["bow"]    # only accomplished weapons appear on the sheet
accomplished_saves = ["wits"]

# Sphere perks, as a flat list of ids. A repeatable perk appears once PER
# RANK - Toughness twice = rank 2. The pick budget is shared across perks,
# feats and spells (see the system's `progression`): 3 at level 1 + 1 per
# later level = 7 at level 5. Spent: 4 perks + 1 homebrew + 1 feat rank
# + 1 spell = 7.
perks = ["keen_eye", "scholar", "toughness", "toughness"]

# Known spells, as a flat id list against the active spells pack
# (sample.spells.toml). Gated by cast_attribute score per spell rank.
spells = ["hearth_mend"]

# inventory: what the character carries. Each entry is a thin REFERENCE into
# your item library (/pmt items), never a copy - `item_id` is the library key,
# and only the per-character state lives here:
#   equipped - weapons and equipment; an equipped weapon item adds its bonus to
#              the linked weapon's attack rolls, equipment adds its ac_bonus to AC
#   count    - gear only (the editable counter on the sheet)
# Editing the library item updates every character holding it. An item_id your
# library does not know renders as a missing row (and /pmt validate lists it),
# so importing this sample without those items costs nothing but three dim rows.
[[inventory]]
item_id = "itm_1"     # a weapon item linked to the system's "bow", +1 attack
equipped = true
[[inventory]]
item_id = "itm_2"     # an equipment item worth +1 AC while worn
equipped = true
[[inventory]]
item_id = "itm_3"     # gear: no mechanics, just a counter
count = 12

# Base attribute scores, BEFORE trait bonuses (the sheet shows base, bonus and
# final separately). Budget here: point_buy total 15 + Scholarly Upbringing 2
# + the level-3 milestone point = 18; spent above base 1: 4+7+5 = 16.
[attributes]
might = 5
wits = 8      # final 9 after Human's +1
spirit = 6

# Feat picks, as { line id = rank } against the active feats pack
# (sample.feats.toml). Rank 1 of Keen Study - ranks below the recorded one
# are implicitly owned.
[feats]
keen_study = 1

# Recorded picks for perks that carry a choice, keyed by perk id.
[perk_choices]
scholar = ["lore"]

# custom_perks: homebrew, granted by the DM directly on the character. Same
# effect vocabulary as the system file (see its footer). `replaces` names a
# sphere perk whose slot this fills - prerequisites and exclusivity treat the
# replaced perk as taken, so the tree progresses past a homebrewed alternative
# (here: Trail Sense stands in for Quick Reflexes, unlocking Pathfinder).
# Unknown effect types ("damage_reduction") are shown but never folded into
# totals - they are table rules, applied by people.
[[custom_perks]]
id = "trail_sense"
name = "Trail Sense"
description = "Wren reads the land like a ledger. +1 initiative, Lore gains her Wits modifier a second time, and DR 1 while travelling (table rule)."
replaces = "quick_reflexes"
[[custom_perks.effects]]
type = "initiative"
value = 1
[[custom_perks.effects]]
type = "skill"
skill = "lore"
add_modifier = "wits"
[[custom_perks.effects]]
type = "damage_reduction"   # informational: displayed, not computed
value = 1
